name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（如 v1.15.107-fork.1）；留空则只构建上传 artifact，不创建 Release'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # 连点两次 dispatch 不应并发构建、也不应同时往同一个 tag 写 Release
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon

      - name: Setup signing keystore
        run: |
          cat > app/keystore.properties <<'EOF'
          keyBase64=${{ secrets.SIGNING_KEY }}
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate version input
        if: github.event.inputs.version != ''
        run: |
          v="${{ github.event.inputs.version }}"
          if ! printf '%s' "$v" | grep -Eq '^v[0-9]+(\.[0-9]+)+-fork\.[0-9]+$'; then
            echo "::error::版本号格式不对：$v（应形如 v1.15.107-fork.10）"
            exit 1
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon -x :app:prepareOfflineTranslateLibraries

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: CyIME-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create Release
        if: github.event.inputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: CyIME fork ${{ github.event.inputs.version }}
          generate_release_notes: false
          body: |
            fork 自 Cyletix/CyIME，用自己的正式签名构建，可直接覆盖安装本 fork 的历史版本。

            注意：本包的 release 构建带 `-x :app:prepareOfflineTranslateLibraries`，
            **不含离线翻译库**（上游对应下载任务已 404），需要翻译时请在应用内下载或联网使用。
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
