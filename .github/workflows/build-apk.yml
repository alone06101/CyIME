name: Build Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon

      - name: Setup signing keystore
        run: |
          keytool -genkeypair -v -keystore app/release-keystore.jks -alias cyime \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass cyime123 -keypass cyime123 \
            -dname "CN=CyIME Test, OU=Dev, O=CyIME, L=Beijing, C=CN"
          cat > app/keystore.properties <<'EOF'
          storeFile=release-keystore.jks
          storePassword=cyime123
          keyAlias=cyime
          keyPassword=cyime123
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon -x :app:prepareOfflineTranslateLibraries

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: CyIME-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
